

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barber Premium</title>
<style>
body{
  margin:0;
  background:#0a0a0a;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  color:white;
}

.phone{
  width:360px;
  height:650px;
  background:#111;
  border-radius:30px;
  padding:20px;
  box-shadow:0 0 30px rgba(0,0,0,0.6);
}

.header h2{margin:0}
.header p{color:#888;margin:5px 0}

.filters{
  display:flex;
  gap:10px;
  margin:15px 0;
}

.filter{
  padding:8px 15px;
  border-radius:20px;
  border:1px solid #333;
  cursor:pointer;
}

.active{
  background:#00ff99;
  color:black;
}

.card{
  background:#1a1a1a;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:15px;
}

.card img{
  width:100%;
}

.card .info{
  padding:10px;
}

.times{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
}

.time{
  background:#222;
  padding:6px 10px;
  border-radius:8px;
  cursor:pointer;
}

.time:hover{
  background:#ff3333;
}

.form{
  display:none;
  margin-top:10px;
}

input,select{
  width:100%;
  margin:5px 0;
  padding:8px;
  border-radius:6px;
  border:none;
  background:#222;
  color:white;
}

.btn{
  background:green;
  border:none;
  padding:10px;
  width:100%;
  margin-top:10px;
  border-radius:8px;
  cursor:pointer;
}

.nav{
  position:absolute;
  bottom:20px;
  left:0;
  width:100%;
  display:flex;
  justify-content:space-around;
}

.nav div{
  width:40px;
  height:40px;
  border-radius:10px;
  background:#222;
}

</style>
</head>
<body>

<div class="phone">
  <div class="header">
    <h2>Agenda Barber</h2>
    <p>Selecciona servicio</p>
  </div>

  <div class="filters">
    <div class="filter active">All</div>
    <div class="filter">Hair</div>
    <div class="filter">Beard</div>
  </div>

  <div class="card">
    https://images.unsplash.com/photo-1521590832167-7bcbfaa6381f
    <div class="info">
      <h3>Servicio Barber</h3>
      <p>Corte profesional</p>

      <div class="times" id="times"></div>

      <div class="form" id="form">
        <input id="nombre" placeholder="Nombre">
        <input id="telefono" placeholder="Teléfono">
        <select id="servicio">
          <option>Corte</option>
          <option>Barba</option>
          <option>Corte + Barba</option>
        </select>
        <button class="btn" onclick="enviar()">Confirmar</button>
      </div>

    </div>
  </div>
</div>

<script>
const timesDiv = document.getElementById("times");
const form = document.getElementById("form");
const hours = [11,12,13,14,15,16,17,18,19];
let selectedHour = null;

hours.forEach(h=>{
  const div = document.createElement("div");
  div.className = "time";
  div.innerText = `${h}:00`;
  div.onclick = ()=>{
    selectedHour = h;
    form.style.display = "block";
  };
  timesDiv.appendChild(div);
});

function enviar(){
  const nombre = document.getElementById("nombre").value;
  const telefono = document.getElementById("telefono").value;
  const servicio = document.getElementById("servicio").value;

  const msg = `Cita Barber%0AHora: ${selectedHour}:00%0ANombre: ${nombre}%0AServicio: ${servicio}`;
  const numero = "5218112345678"; // CAMBIA TU NUMERO
  window.open(`https://wa.me/${numero}?text=${msg}`);
}
</script>

</body>
</html>
