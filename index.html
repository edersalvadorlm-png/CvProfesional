
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barbería</title>
<style>
body{margin:0;font-family:Arial;background:black;color:white;text-align:center}
h1{color:red;margin-top:20px}
.container{padding:20px}
button{padding:10px 15px;margin:5px;border:none;border-radius:8px;cursor:pointer}
.day{background:#0b3d91;color:white}
.hour{background:#b30000;color:white}
input,select{padding:10px;margin:5px;width:80%;background:#222;color:white;border:none;border-radius:5px}
.whatsapp{background:green;color:white}
</style>
</head>
<body>
<h1>AGENDA TU CITA</h1>
<div id="days" class="container"></div>
<div id="hours" class="container"></div>
<div id="form" class="container" style="display:none">
  <input id="nombre" placeholder="Nombre"><br>
  <input id="telefono" placeholder="Teléfono"><br>
  <select id="servicio">
    <option>Corte</option>
    <option>Barba</option>
    <option>Corte + Barba</option>
  </select><br>
  <button class="whatsapp" onclick="confirmar()">Confirmar por WhatsApp</button>
</div>
<script>
const days=["Lunes","Martes","Miércoles","Jueves","Viernes"];
const hours=[11,12,13,14,15,16,17,18,19];
let selectedDay=null;
let selectedHour=null;
const daysDiv=document.getElementById("days");
const hoursDiv=document.getElementById("hours");
// mostrar dias
 days.forEach(d=>{
   const btn=document.createElement("button");
   btn.innerText=d;
   btn.className="day";
   btn.onclick=()=>selectDay(d);
   daysDiv.appendChild(btn);
 });
function selectDay(day){
  selectedDay=day;
  hoursDiv.innerHTML="<h3>Horas disponibles</h3>";
  hours.forEach(h=>{
    const btn=document.createElement("button");
    btn.innerText=`${h}:00 - ${h+1}:00`;
    btn.className="hour";
    btn.onclick=()=>selectHour(h);
    hoursDiv.appendChild(btn);
  });
}
function selectHour(hour){
  selectedHour=hour;
  document.getElementById("form").style.display="block";
}
function confirmar(){
  const nombre=document.getElementById("nombre").value;
  const telefono=document.getElementById("telefono").value;
  const servicio=document.getElementById("servicio").value;
  const msg=`Hola quiero agendar cita:%0ADía: ${selectedDay}%0AHora: ${selectedHour}:00%0AServicio: ${servicio}%0ANombre: ${nombre}`;
  const numeroBarberia="5218112345678"; // ⚠️ CAMBIA ESTE NUMERO POR EL TUYO (FORMATO: 521 + lada + número)
  const url=`https://wa.me/${numeroBarberia}?text=${msg}`;
  window.open(url,"_blank");
}
</script>

</body>
</html>
